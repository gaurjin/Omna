[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "omna"
version = "0.2.1"
description = "Semantic search, PII masking, and schema understanding for Polars DataFrames"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gaurav", email = "gaurjin@gmail.com" },
]
keywords = [
    "polars", "semantic-search", "embeddings", "pii",
    "nlp", "dataframe", "rust", "fastembed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core runtime dependency — everything else is optional.
# Heavy deps (fastembed, anthropic) are lazy-loaded inside their respective
# methods and declared in [project.optional-dependencies] below. PII masking
# is powered by the compiled `omna_pii_mask` wheel (no heavy Python ML deps).
dependencies = [
    "polars>=1.0",
    # numpy: imported at `import omna` time — hybrid BM25/RRF (hybrid.py), index
    # persistence (index.py), search/filter vector ops (frame.py).
    "numpy>=1.26",
    # rich: imported at `import omna` time by understand.py; powers the pretty
    # console output for understand()/search()/pii_report()/mask_pii()/ask().
    "rich>=13.0",
]

[project.urls]
Homepage   = "https://github.com/gaurjin/omna"
Repository = "https://github.com/gaurjin/omna"
Issues     = "https://github.com/gaurjin/omna/issues"
Changelog  = "https://github.com/gaurjin/omna/blob/main/CHANGELOG.md"

# ── Optional dependency groups ────────────────────────────────────────────────
# Install the full stack:  pip install omna[embed,pii,ask]
# Install everything:      pip install omna[all]
[project.optional-dependencies]

# Required for df.omna.embed(), df.omna.search(), df.omna.filter()
embed = [
    "fastembed>=0.8",
    "onnxruntime>=1.18",
    # numpy is a core dependency (see [project.dependencies]); not repeated here.
]

# df.omna.mask_pii() and df.omna.pii_report() route to the compiled
# `omna-pii-mask` wheel (the unified L1–L6 Rust engine: links ONNX Runtime,
# runs the on-device L3 AI model in-process, no heavy Python ML deps).
pii = [
    "omna-pii-mask>=0.2,<0.3",
]

# Required for df.omna.ask()
# Also set:  export ANTHROPIC_API_KEY=sk-ant-...
# ask() masks the sampled rows with the omna-pii-mask engine BEFORE they leave
# the process (privacy default), so the engine is a hard dependency of [ask].
# Pass mask_rows=False to skip masking (synthetic/public data only).
ask = [
    "anthropic>=0.26",
    "omna-pii-mask>=0.2,<0.3",
]

# All optional features combined
all = [
    "omna[embed]",
    "omna[pii]",
    "omna[ask]",
]

# Development tools (faker is only used by scripts/generate_demo_data.py)
dev = [
    "pytest>=8.0",
    "maturin>=1.0",
    "faker>=40.15.0",
    "omna[all]",
]

# ── Test configuration ────────────────────────────────────────────────────────
# Scope collection to tests/ so a bare `pytest` doesn't pick up scripts/ helpers
# (e.g. scripts/smoke_test.py errors at collection without its data files).
[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Maturin build configuration ───────────────────────────────────────────────
[tool.maturin]
# Include the omna/ Python package in the wheel alongside the Rust extension.
# The Rust extension (_omna) is included automatically from Cargo.toml.
python-packages = ["omna"]
# Required by PyO3 when building an extension module.
features = ["pyo3/extension-module"]
